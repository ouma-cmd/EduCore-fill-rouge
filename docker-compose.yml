services:
  frontend:
    build:
      context: ./Frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./Backend
    ports:
      - "3000:3000"
    env_file:
      - ./Backend/.env
    depends_on:
      - dataBase
      
  dataBase:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
